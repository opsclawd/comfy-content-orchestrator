      name: x-client-id

  responses:
    Unauthorized:
      description: Missing authentication token or client context
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Access denied for requested tenant resource or reviewer role
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found within tenant scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Lexical or schema validation error
      content:
        application/json:
          schema:
