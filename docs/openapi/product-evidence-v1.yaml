openapi: 3.1.0
info:
  title: Product & Batch Evidence Dossier API
  version: 1.0.0
  description: >
    Tenant-scoped, private control plane APIs for product SKU and lot registry,
    tamper-evident original media uploads, derivative reference linking,
    Certificate of Analysis (CoA) measurement entry and review, claim verification,
    invalidation, and comprehensive provenance dossier resolution.
servers:
  - url: /api/v1/clients/{clientId}
    description: Client-scoped API gateway base
    variables:
      clientId:
        description: Authenticated client tenant UUID
        default: "018e69e0-8a6a-72cb-b1b7-ec79a1f73001"

security:
  - BearerAuth: []
  - ClientHeader: []

paths:
  # ============================================================================
  # Product SKU Endpoints
  # ============================================================================
  /product-skus:
    post:
      summary: Register a new product SKU
      operationId: createProductSku
      tags: [Product SKU]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSkuRequest"
      responses:
        "201":
          description: Product SKU created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductSkuResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

    get:
      summary: List product SKUs for the tenant
      operationId: listProductSkus
      tags: [Product SKU]
      responses:
        "200":
          description: List of product SKUs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductSkuListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /product-skus/{skuId}:
    parameters:
      - name: skuId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get product SKU by ID
      operationId: getProductSku
      tags: [Product SKU]
      responses:
        "200":
          description: Product SKU details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductSkuResponse"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      summary: Update product SKU metadata
      operationId: updateProductSku
      tags: [Product SKU]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSkuMetadataRequest"
      responses:
        "200":
          description: Product SKU metadata updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductSkuResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /product-skus/{skuId}/archive:
    parameters:
      - name: skuId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Archive a product SKU
      operationId: archiveProductSku
      tags: [Product SKU]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveSkuRequest"
      responses:
        "200":
          description: Product SKU archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductSkuResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ============================================================================
  # Product Batch & Facts Endpoints
  # ============================================================================
  /batches:
    post:
      summary: Register a new product batch / lot
      operationId: createProductBatch
      tags: [Product Batch]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBatchRequest"
      responses:
        "201":
          description: Product batch created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateBatchResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"

    get:
      summary: List product batches for the tenant
      operationId: listProductBatches
      tags: [Product Batch]
      parameters:
        - name: skuId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of product batches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductBatchListResponse"

  /batches/{batchId}:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get product batch by ID
      operationId: getProductBatch
      tags: [Product Batch]
      responses:
        "200":
          description: Product batch details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductBatchResponse"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      summary: Update product batch metadata
      operationId: updateProductBatch
      tags: [Product Batch]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBatchMetadataRequest"
      responses:
        "200":
          description: Product batch updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductBatchResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /batches/{batchId}/archive:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Archive a product batch
      operationId: archiveProductBatch
      tags: [Product Batch]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveBatchRequest"
      responses:
        "200":
          description: Product batch archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductBatchResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /batches/{batchId}/facts:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Append immutable facts revision to batch
      operationId: appendBatchFacts
      tags: [Product Batch Facts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendBatchFactsRequest"
      responses:
        "201":
          description: Facts revision appended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchFactsRevisionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    get:
      summary: Get complete history of immutable facts revisions for batch
      operationId: getBatchFactsHistory
      tags: [Product Batch Facts]
      responses:
        "200":
          description: Chronological list of batch facts revisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchFactsRevisionHistoryResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ============================================================================
  # Evidence Asset Endpoints
  # ============================================================================
  /batches/{batchId}/evidence:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Register evidence asset (multipart upload or JSON source reuse)
      operationId: registerEvidenceAsset
      tags: [Evidence Asset]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, purpose, sourceClass, acquisitionMethod, assertionText]
              properties:
                file:
                  type: string
                  format: binary
                purpose:
                  type: string
                sourceClass:
                  type: string
                acquisitionMethod:
                  type: string
                assertionText:
                  type: string
                rightsStatus:
                  type: string
                  enum: [unknown, granted, restricted, denied]
                consentStatus:
                  type: string
                  enum: [unknown, granted, restricted, denied]
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterEvidenceAssetRequest"
      responses:
        "201":
          description: Evidence asset registered without exposing raw internal storage credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafeRegisterEvidenceAssetResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"

    get:
      summary: List evidence assets linked to this batch
      operationId: listBatchEvidence
      tags: [Evidence Asset]
      responses:
        "200":
          description: List of batch evidence items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceAssetListResponse"

  /batches/{batchId}/evidence/{evidenceId}:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: evidenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get head revision of evidence asset
      operationId: getEvidenceAssetHead
      tags: [Evidence Asset]
      responses:
        "200":
          description: Evidence asset head details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceAssetDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /batches/{batchId}/evidence/{evidenceId}/revisions/{revision}:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: evidenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: revision
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      summary: Get specific immutable revision of evidence asset
      operationId: getEvidenceRevision
      tags: [Evidence Asset]
      responses:
        "200":
          description: Evidence revision details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceRevision"
        "404":
          $ref: "#/components/responses/NotFound"

  /batches/{batchId}/evidence/{evidenceId}/revisions/{revision}/derivative:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: evidenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: revision
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      summary: Link render-ready derivative reference asset to evidence revision
      operationId: linkEvidenceDerivative
      tags: [Evidence Derivative]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkEvidenceDerivativeRequest"
      responses:
        "200":
          description: Derivative linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceDerivative"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    get:
      summary: Get derivative reference link for evidence revision
      operationId: getEvidenceDerivative
      tags: [Evidence Derivative]
      responses:
        "200":
          description: Derivative reference asset info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceDerivative"
        "404":
          $ref: "#/components/responses/NotFound"

  /batches/{batchId}/evidence/{evidenceId}/revisions/{revision}/verification-events:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: evidenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: revision
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      summary: Record tamper-evident verification event for evidence revision
      operationId: recordEvidenceVerificationEvent
      tags: [Evidence Verification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordEvidenceVerificationEventRequest"
      responses:
        "200":
          description: Verification event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceVerificationEvent"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    get:
      summary: List verification events recorded for evidence revision
      operationId: listEvidenceVerificationEvents
      tags: [Evidence Verification]
      responses:
        "200":
          description: List of verification events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceVerificationEventListResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /batches/{batchId}/evidence/{evidenceId}/revisions/{revision}/media:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: evidenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: revision
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      summary: Get short-lived (300s) presigned delivery URL for original media
      operationId: deliverEvidenceMedia
      tags: [Evidence Media]
      responses:
        "200":
          description: Presigned delivery URL metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceMediaDeliveryResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ============================================================================
  # Certificate of Analysis (CoA) Endpoints
  # ============================================================================
  /batches/{batchId}/coa-reports:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Create CoA report with structured analytical measurements
      operationId: createCoaReport
      tags: [CoA Report]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCoaReportRequest"
      responses:
        "201":
          description: CoA report created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoaReportCreationResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"

    get:
      summary: List CoA reports for batch
      operationId: listCoaReports
      tags: [CoA Report]
      responses:
        "200":
          description: List of CoA reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoaReportListResponse"

  /batches/{batchId}/coa-reports/{reportId}:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: reportId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get head revision of CoA report
      operationId: getCoaReport
      tags: [CoA Report]
      responses:
        "200":
          description: CoA report head and current revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoaReportDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /batches/{batchId}/coa-reports/{reportId}/revisions/{revision}:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: reportId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: revision
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      summary: Get specific immutable revision of CoA report and measurement panel
      operationId: getCoaReportRevision
      tags: [CoA Report]
      responses:
        "200":
          description: CoA report revision and measurements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoaReportRevision"
        "404":
          $ref: "#/components/responses/NotFound"

  /batches/{batchId}/coa-reports/{reportId}/supersede:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: reportId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Supersede CoA report with corrected revision
      operationId: supersedeCoaReport
      tags: [CoA Report]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupersedeCoaReportRequest"
      responses:
        "200":
          description: CoA report superseded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoaReportCreationResponse"
        "409":
          $ref: "#/components/responses/Conflict"

  /batches/{batchId}/coa-reports/{reportId}/review:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: reportId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Review and approve/reject head of CoA report
      operationId: reviewCoaReport
      tags: [CoA Report]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewCoaReportRequest"
      responses:
        "200":
          description: CoA review decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewCoaReportResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /batches/{batchId}/coa-reports/{reportId}/archive:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: reportId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Archive CoA report
      operationId: archiveCoaReport
      tags: [CoA Report]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveCoaReportRequest"
      responses:
        "200":
          description: CoA report archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveCoaReportResponse"
        "409":
          $ref: "#/components/responses/Conflict"

  # ============================================================================
  # Product Claim Endpoints
  # ============================================================================
  /batches/{batchId}/claims:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Create a product claim
      operationId: createClaim
      tags: [Product Claim]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClaimRequest"
      responses:
        "201":
          description: Claim created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductClaim"
        "400":
          $ref: "#/components/responses/ValidationError"

    get:
      summary: List product claims for batch
      operationId: listClaims
      tags: [Product Claim]
      responses:
        "200":
          description: List of product claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductClaimListResponse"

  /batches/{batchId}/claims/{claimId}:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: claimId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get head revision and resolution of product claim
      operationId: getClaim
      tags: [Product Claim]
      responses:
        "200":
          description: Claim details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductClaimDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /batches/{batchId}/claims/{claimId}/revisions/{revision}:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: claimId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: revision
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      summary: Get specific immutable revision of product claim
      operationId: getClaimRevision
      tags: [Product Claim]
      responses:
        "200":
          description: Claim revision details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductClaimRevision"
        "404":
          $ref: "#/components/responses/NotFound"

  /batches/{batchId}/claims/{claimId}/revisions:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: claimId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Append revision to claim
      operationId: appendClaimRevision
      tags: [Product Claim]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendClaimRevisionRequest"
      responses:
        "200":
          description: Claim revision appended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductClaim"
        "409":
          $ref: "#/components/responses/Conflict"

  /batches/{batchId}/claims/{claimId}/evidence-links:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: claimId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Link supporting evidence or CoA measurement to claim
      operationId: linkClaimEvidence
      tags: [Product Claim]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkClaimEvidenceRequest"
      responses:
        "200":
          description: Evidence links updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClaimEvidenceLink"
        "409":
          $ref: "#/components/responses/Conflict"

  /batches/{batchId}/claims/{claimId}/review:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: claimId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Review and approve/reject claim
      operationId: reviewClaim
      tags: [Product Claim]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewClaimRequest"
      responses:
        "200":
          description: Claim review completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewClaimResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /batches/{batchId}/claims/{claimId}/invalidate:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: claimId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Invalidate a claim due to upstream evidence failure, supersession or dispute
      operationId: invalidateClaim
      tags: [Product Claim]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvalidateClaimRequest"
      responses:
        "200":
          description: Claim invalidated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidateClaimResponse"
        "409":
          $ref: "#/components/responses/Conflict"

  # ============================================================================
  # Batch Evidence Dossier Query
  # ============================================================================
  /batches/{batchId}/dossier:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Read coherent, full-provenance batch evidence dossier
      description: >
        Resolves tenant-scoped SKU identity, lot/version, facts history,
        evidence sources, derivative reference links, verification events,
        CoA reports and structured measurements, product claims with eligibility
        and block reasons, and complete provenance links. Never flattens unverified
        values into an 'approved specs' object.
      operationId: getBatchEvidenceDossier
      tags: [Batch Evidence Dossier]
      responses:
        "200":
          description: Complete explicit provenance dossier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchEvidenceDossier"
        "404":
          $ref: "#/components/responses/NotFound"

