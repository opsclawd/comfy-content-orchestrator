            - SOURCE_SUPERSEDED
            - SOURCE_DISPUTED
            - CROSS_BATCH_SOURCE
            - REPORT_DISPUTED
            - EVIDENCE_REVISION_LOCKED
            - INVALID_MEASUREMENT_DECIMAL
            - UNVERIFIED_CLAIM_PROVENANCE
            - UNSUPPORTED_MIME_TYPE
            - STORAGE_CONFIGURATION_ERROR
            - INTERNAL_ERROR
