          items:
            $ref: "#/components/schemas/CoaReportRevision"
        reviewEvents:
          type: array
          items:
            $ref: "#/components/schemas/CoaReviewEvent"

    DossierClaimItem:
      type: object
      required:
        - claim
        - currentRevision
        - revisions
        - links
        - decisionEvents
        - resolution
      properties:
        claim: { $ref: "#/components/schemas/ProductClaim" }
        currentRevision: { $ref: "#/components/schemas/ProductClaimRevision" }
        revisions:
          type: array
          items:
            $ref: "#/components/schemas/ProductClaimRevision"
        links:
          type: array
          items:
            $ref: "#/components/schemas/ClaimEvidenceLink"
        decisionEvents:
          type: array
          items:
            $ref: "#/components/schemas/ClaimDecisionEvent"
        resolution: { $ref: "#/components/schemas/ResolveClaimResponse" }
