name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Architecture boundaries are a hard gate, not advisory (PRD §3.6.2).
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:db
      - run: pnpm boundaries
      - run: pnpm format
      - run: pnpm check:control-plane

      - uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/buildkit
            /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ hashFiles('apps/control-api/Dockerfile', 'apps/web/Dockerfile', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-docker-

      - run: pnpm check:control-plane-images
      - run: pnpm smoke:control-plane
