name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Architecture boundaries are a hard gate, not advisory (PRD §3.6.2).
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm boundaries
      - run: pnpm format
