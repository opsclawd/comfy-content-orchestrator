name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-typecheck:
    name: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Architecture boundaries are a hard gate, not advisory (PRD §3.6.2).
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm boundaries

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # johnvansickle.com's static-build origin is a single, small,
      # non-CDN server under heavy worldwide CI load and has intermittently
      # served bad bytes to GitHub Actions runners specifically (see #192,
      # #193). Caching the verified binaries, keyed on .ffmpeg-version, means
      # that server is only ever hit once per version bump instead of on
      # every single CI run.
      - name: Cache FFmpeg binaries
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ffmpeg-bin
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('.ffmpeg-version') }}

      - name: Install FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          FFMPEG_INSTALL_DIR="${HOME}/.cache/ffmpeg-bin" ./scripts/install-ffmpeg.sh

      - name: Verify FFmpeg
        run: |
          echo "${HOME}/.cache/ffmpeg-bin" >> "${GITHUB_PATH}"
          export PATH="${HOME}/.cache/ffmpeg-bin:${PATH}"
          ./scripts/check-ffmpeg-version.sh

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
      - run: pnpm test:assembly
      - run: pnpm test:db
      - run: pnpm check:control-plane

  docker-smoke:
    name: docker-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: docker/setup-buildx-action@v3

      # Confirmed via run 34498914007 that the docker-container buildx builder
      # is genuinely the default (* in buildx ls), so plain docker build calls
      # in downstream scripts share this builder's GHA cache.
      - name: Show Docker builder topology
        run: |
          {
            echo '### Docker builder topology'
            echo '```'
            docker version
            echo '---'
            docker buildx ls
            echo '---'
            docker info --format '{{.DriverStatus}}'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Warm-build both images through the GitHub Actions cache backend
      # (type=gha persists across runs, unlike a plain local directory).
      # check-control-plane-images.sh and smoke-control-plane.sh still do
      # their own `docker build` afterward, unmodified — this keeps the
      # scripts themselves untouched (#82's "purely CI wiring" scope)
      # rather than threading cache flags through their own docker build
      # invocations.
      - name: Warm Docker build cache (Control API)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/control-api/Dockerfile
          push: false
          load: true
          tags: cco-control-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Warm Docker build cache (Review Hub)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: cco-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: check:control-plane-images
        run: |
          START=$(date +%s)
          pnpm check:control-plane-images
          echo "check:control-plane-images duration: $(( $(date +%s) - START ))s" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: smoke:control-plane
        run: |
          START=$(date +%s)
          pnpm smoke:control-plane
          echo "smoke:control-plane duration: $(( $(date +%s) - START ))s" | tee -a "$GITHUB_STEP_SUMMARY"

  quality-gates:
    name: quality-gates
    runs-on: ubuntu-latest
    needs:
      - lint-and-typecheck
      - tests
      - docker-smoke
    if: always()
    steps:
      - name: Aggregate quality gate status
        run: |
          echo "Gate results:"
          echo "  lint-and-typecheck: ${{ needs.lint-and-typecheck.result }}"
          echo "  tests:              ${{ needs.tests.result }}"
          echo "  docker-smoke:       ${{ needs.docker-smoke.result }}"
          if [ "${{ needs.lint-and-typecheck.result }}" != "success" ] || \
             [ "${{ needs.tests.result }}" != "success" ] || \
             [ "${{ needs.docker-smoke.result }}" != "success" ]; then
            echo "::error::One or more upstream CI quality gates failed or were cancelled."
            exit 1
          fi
          echo "All CI quality gates passed successfully."
