name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Architecture boundaries are a hard gate, not advisory (PRD §3.6.2).
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:db
      - run: pnpm boundaries
      - run: pnpm format
      - run: pnpm check:control-plane

      - uses: docker/setup-buildx-action@v3

      # Warm-build both images through the GitHub Actions cache backend
      # (type=gha persists across runs, unlike a plain local directory).
      # check-control-plane-images.sh and smoke-control-plane.sh still do
      # their own `docker build` afterward, unmodified — setup-buildx-action
      # makes buildx the default builder for the whole job, so those plain
      # `docker build` calls route through the same builder instance and
      # hit its local content-addressable cache from these steps, even
      # though they build under different tags. This keeps the scripts
      # themselves untouched (#82's "purely CI wiring" scope) rather than
      # threading cache flags through their own docker build invocations.
      - name: Warm Docker build cache (Control API)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/control-api/Dockerfile
          push: false
          load: true
          tags: cco-control-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Warm Docker build cache (Review Hub)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: cco-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: check:control-plane-images
        run: |
          START=$(date +%s)
          pnpm check:control-plane-images
          echo "check:control-plane-images duration: $(( $(date +%s) - START ))s" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: smoke:control-plane
        run: |
          START=$(date +%s)
          pnpm smoke:control-plane
          echo "smoke:control-plane duration: $(( $(date +%s) - START ))s" | tee -a "$GITHUB_STEP_SUMMARY"
